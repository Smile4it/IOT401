services:

###########################
#         BROKER          #
###########################

  broker-public:
    image: eclipse-mosquitto:2.0.18
    container_name: broker-public
    user: "0:0"
    restart: unless-stopped
    port:
      - "8887:8887"
    volumes:
        - ./mosquitto/mosquitto.conf:/mosquitto/config/mosquitto.conf
        - ./mosquitto/acl:/mosquitto/config/acl
        - ./certs:/mosquitto/certs:ro

  broker-prive:
    image: eclipse-mosquitto:2.0.18
    container_name: broker-prive
    user: "0:0"
    restart: unless-stopped
    port:
      - "8888:8888"
    volumes:
        - ./mosquitto/mosquitto.conf:/mosquitto/config/mosquitto.conf
        - ./mosquitto/acl:/mosquitto/config/acl
        - ./certs:/mosquitto/certs:ro


###########################
#         SENSORS         #
###########################

  sensors-presence_1:
    build: ./sensors/presence/presence.py
    environnement: 
      PRESENCE-ID: presence_1  
    depends_on:
      - broker-public
    volumes:
      - ./certs:/app/certs:ro

  sensors-presence_2:
    build: ./sensors/presence/presence.py
    environnement: 
      PRESENCE-ID: presence_2  
    depends_on:
      - broker-public
    volumes:
      - ./certs:/app/certs:ro

  sensors-smoke:
    build: ./sensors/smoke/smoke.py
    environnement: 
      SMOKE-ID: SMOKE  
    depends_on:
      - broker-prive
    volumes:
      - ./certs:/app/certs:ro

  sensors-temperature:
    build: ./sensors/weather/temperature.py
    environnement: 
      TEMPERATURE-ID: TEMPERATURE  
    depends_on:
      - broker-public
    volumes:
      - ./certs:/app/certs:ro

  sensors-wind:
    build: ./sensors/weather/wind.py
    environnement: 
      WIND-ID: WIND  
    depends_on:
      - broker-public
    volumes:
      - ./certs:/app/certs:ro

  sensors-humidity:
    build: ./sensors/weather/humidity.py
    environnement: 
      HUMIDITY-ID: HUMIDITY  
    depends_on:
      - broker-public
    volumes:
      - ./certs:/app/certs:ro

  radar-speed:
    build: ./sensors/radar/speed.py
    environnement: 
      SPEED-ID: SPEED  
    depends_on:
      - broker-prive
    volumes:
      - ./certs:/app/certs:ro

  radar-traffic-light:
    build: ./sensors/radar/traffic-light.py
    environnement: 
      TRAFFIC-LIGHT-ID: TRAFFIC-LIGHT  
    depends_on:
      - broker-prive
    volumes:
      - ./certs:/app/certs:ro

###########################
#      SENSOR INTRU       #
###########################

  sensors-intru_1:
    build: ./sensors/intrus/intrus.py
    environment:
      PRESENCE-ID: INTRU_1
    depends_on:
      - broker-public
    volumes:
      - ./certs:/app/certs:ro

  sensors-intru_2:
    build: ./sensors/intrus/intrus.py
    environment:
      PRESENCE-ID: INTRU_2
    depends_on:
      - broker-public
    volumes:
      - ./certs:/app/certs:ro

###########################
#        SUPERVISOR       #
###########################

  supervisor:
    build: ./supervisor/
    depends_on:
      - broker-public
      - broker-prive
    volumes:
      - ./certs:/app/certs:ro